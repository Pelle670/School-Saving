    by.forEach((arr,mat)=>{const pos=[],nor=[];
      arr.forEach(o=>{const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);pos.push(g.attributes.position.array);nor.push(g.attributes.normal.array);g.dispose()});
      const n=pos.reduce((a,b)=>a+b.length,0),P=new Float32Array(n),N=new Float32Array(n);let k=0;
      pos.forEach((a,i)=>{P.set(a,k);N.set(nor[i],k);k+=a.length});
      const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(P,3));geo.setAttribute('normal',new T.BufferAttribute(N,3));
      out.add(new T.Mesh(geo,mat));done.push(...arr)});
    done.forEach(o=>o.parent&&o.parent.remove(o));scene.add(out);return out;
  }catch(e){console.warn('merge skipped',e);return null}
}
function env(c){
  ENV=1;const {x0,x1,z0,z1}=BB,cx=(x0+x1)/2,cz=(z0+z1)/2,en=ENT,dx=en.dx,dz=en.dz,px=-dz,pz=dx;
  bx(E,900,.15,900,cx,-.2,cz,c.grass);
  const pl=48;bx(E,dx?pl:4,.06,dx?4:pl,en.x+dx*pl/2,-.05,en.z+dz*pl/2,0xbfb8a8);
  const he=Math.abs(dx)*(x1-x0)/2+Math.abs(dz)*(z1-z0)/2,fx=cx-dx*(he+38),fz=cz-dz*(he+38);
  bx(E,50,.04,28,fx,-.05,fz,0x62a757);
  for(const [sx,sz,x,z] of[[50,.2,0,-14],[50,.2,0,14],[.2,28,-25,0],[.2,28,25,0],[.2,28,0,0]])bx(E,sx,.02,sz,fx+x,0,fz+z,0xffffff,1);
  for(const s of[-1,1]){bx(E,.1,2.4,6,fx+s*25,0,fz,0xffffff);bx(E,.1,.1,6,fx+s*25,2.4,fz,0xffffff)}
  const bs=new T.Group(),bxp=en.x+dx*16+px*12,bzp=en.z+dz*16+pz*12;bs.position.set(bxp,0,bzp);bs.rotation.y=dx?0:PI/2;E.add(bs);
  bx(bs,10,2.4,2.6,0,.6,0,0xf2b705);bx(bs,10.05,.25,2.65,0,1.0,0,0x111111);bx(bs,10,.1,2.6,0,3,0,0xf2b705);
  for(let i=0;i<6;i++)bx(bs,1.1,.8,2.66,-4+i*1.6,1.7,0,0x1b2a3a);for(const x of[-3.2,3.2])for(const z of[-1.3,1.3]){const w=cy(bs,.55,.3,x,.0,z,0x111111);w.rotation.x=PI/2}
  bx(bs,.1,.3,.5,5.02,.8,.8,0xffee99,1);bx(bs,.1,.3,.5,5.02,.8,-.8,0xffee99,1);
  const fpx=en.x+dx*9-px*8,fpz=en.z+dz*9-pz*8;cy(E,.07,9,fpx,0,fpz,0xcccccc);bx(E,1.8,1.1,.03,fpx+.9,7.6,fpz,c.flag);
  for(let i=0;i<30;i++){const x=cx+(rnd()-.5)*260,z=cz+(rnd()-.5)*260;
    if(x>x0-12&&x<x1+12&&z>z0-12&&z<z1+12)continue;const t=(x-en.x)*dx+(z-en.z)*dz,pp=(x-en.x)*px+(z-en.z)*pz;
    if(t>-3&&t<52&&Math.abs(pp)<5)continue;if(Math.abs(x-fx)<32&&Math.abs(z-fz)<20)continue;if(Math.hypot(x-bxp,z-bzp)<12)continue;if(c.xt=='lake'&&z>z1+6)continue;
    const r=Math.round((1.6+rnd()*1)*5)/5;cy(E,.28,2.4,x,0,z,0x5a3a1e);sp(E,r,x,3+r*.3,z,c.leaf);sp(E,r*.7,x+.7,2.4+r*.3,z+.4,c.leaf)}
  if(c.xt=='lake'){bx(E,600,.1,170,cx,-.1,z1+14+85,0x2d7aa0);bx(E,3,.15,28,cx,0,z1+14,0x8a6a4a);for(let i=0;i<8;i++)bx(E,.2,1,.2,cx+(i%2?1.4:-1.4),-.5,z1+8+i*3.6,0x5a3a1e)}
  if(c.night){const g=new T.BufferGeometry(),a=[];for(let i=0;i<500;i++){const u=rnd()*PI*2,v=rnd()*1.3+.1,r=450;a.push(r*Math.cos(u)*Math.sin(v),r*Math.cos(v),r*Math.sin(u)*Math.sin(v))}
    g.setAttribute('position',new T.Float32BufferAttribute(a,3));E.add(new T.Points(g,new T.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false})));sp(E,14,-180,200,-250,0xf6f1d6,1)}
  scene.background=new T.Color(c.sky);scene.fog=new T.Fog(c.sky,200,640);hemi.color.set(c.hc);hemi.intensity=c.hi;sun.color.set(c.sun);sun.intensity=c.si;sun.position.set(...c.sp);ENV=0;
}

/* ===== UI + modes ===== */
const P={x:0,z:0,yaw:0,pitch:0,f:0},k={};let th=.7,ph=.95,R=78;
const plane=new T.Plane(new T.Vector3(0,-1,0),1.35),CP=[plane];ren.localClippingEnabled=true;
function apply(){
  const cut=mode==='orbit'&&state.cut;plane.constant=state.sel*FH+1.35;
  CM.forEach(m=>{if(!!m.clippingPlanes!==cut){m.clippingPlanes=cut?CP:null;m.needsUpdate=true}});
  $('bc').classList.toggle('on',state.cut);$('bc').style.display=mode==='orbit'?'':'none';$('fb').style.display=mode==='orbit'&&state.cut?'flex':'none';
  [...$('fb').children].forEach((b,i)=>b.classList.toggle('on',i===state.sel));
  $('vo').classList.toggle('on',mode==='orbit');$('vw').classList.toggle('on',mode==='walk');
}
function setMode(m){mode=m;if(m==='walk'&&!P.init)spawn();if(m==='orbit'&&document.exitPointerLock)document.exitPointerLock();apply()}
function spawn(){const e=bl.ent;P.init=1;P.f=0;P.x=e.x+e.dx*9;P.z=e.z+e.dz*9;P.yaw=Math.atan2(e.dx,e.dz);P.pitch=0}
function goRoom(r){setMode('walk');P.init=1;P.f=r.f;P.x=r.tx;P.z=r.tz;P.yaw=r.yaw;P.pitch=0;if(ren.domElement.requestPointerLock)ren.domElement.requestPointerLock()}
function go(f){const e=bl.ent;P.f=f;P.x=e.ax;P.z=e.az;P.yaw=Math.atan2(e.dx,e.dz)}
function load(i){
  cur=i;sd=11+i;th=.7;ph=.95;if(G){scene.remove(G);scene.remove(E);merged.forEach(m=>{if(m){scene.remove(m);m.children.forEach(c=>c.geometry.dispose())}})}build(SCH[i]);R=Math.round(bl.ext*.9+30);state.sel=0;P.init=0;if(mode==='walk')spawn();
  [...$('tabs').children].forEach((b,j)=>b.classList.toggle('on',j===i));
  $('fb').innerHTML='';if(bl.nF>1)for(let f=0;f<bl.nF;f++){const b=document.createElement('button');b.textContent='Floor '+(f+1);b.onclick=()=>{state.sel=f;apply()};$('fb').appendChild(b)}
  const el=$('rooms');el.innerHTML='<h3>Go to a room</h3>';
  const e0=document.createElement('button');e0.textContent='Front entrance';e0.onclick=()=>{setMode('walk');spawn();if(ren.domElement.requestPointerLock)ren.domElement.requestPointerLock()};el.appendChild(e0);
  rooms.forEach(r=>{const b=document.createElement('button');b.textContent=(bl.nF>1?'F'+(r.f+1)+' · ':'')+r.name;b.onclick=()=>goRoom(r);el.appendChild(b)});
  apply();
}
SCH.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.title=s.shape;b.onclick=()=>load(i);$('tabs').appendChild(b)});
$('vo').onclick=()=>setMode('orbit');$('vw').onclick=()=>{setMode('walk');if(ren.domElement.requestPointerLock)ren.domElement.requestPointerLock()};
$('bc').onclick=()=>{state.cut=!state.cut;apply()};

const cv=ren.domElement;let drag=0,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=1;lx=e.clientX;ly=e.clientY;if(mode==='walk'&&!document.pointerLockElement&&cv.requestPointerLock)cv.requestPointerLock()});
addEventListener('pointerup',()=>drag=0);
addEventListener('pointermove',e=>{
  if(mode==='orbit'){if(!drag)return;th-=(e.clientX-lx)*.006;ph=Math.min(1.45,Math.max(.12,ph-(e.clientY-ly)*.006))}
  else if(document.pointerLockElement||drag){const dx=document.pointerLockElement?e.movementX:e.clientX-lx,dy=document.pointerLockElement?e.movementY:e.clientY-ly;P.yaw-=dx*.003;P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch-dy*.003))}
  lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{R=Math.min(320,Math.max(15,R*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{k[e.code]=1;if(mode==='walk'){if(e.code==='Digit1')go(0);if(e.code==='Digit2'&&bl.nF>1)go(1)}if(e.code==='KeyC'&&mode==='orbit'){state.cut=!state.cut;apply()}});
addEventListener('keyup',e=>k[e.code]=0);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const hit=(x,z)=>cols.some(c=>c.f===P.f&&x>c.x0-.3&&x<c.x1+.3&&z>c.z0-.3&&z<c.z1+.3);
function walk(dt){
  const fw=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0),st=(k.KeyD?1:0)-(k.KeyA?1:0);
  P.yaw+=((k.ArrowLeft?1:0)-(k.ArrowRight?1:0))*dt*1.8;
  const v=(k.ShiftLeft||k.ShiftRight?6:3)*dt,dx=(-Math.sin(P.yaw)*fw+Math.cos(P.yaw)*st)*v,dz=(-Math.cos(P.yaw)*fw-Math.sin(P.yaw)*st)*v;
  if(!hit(P.x+dx,P.z))P.x+=dx;if(!hit(P.x,P.z+dz))P.z+=dz;P.x=Math.max(-300,Math.min(300,P.x));P.z=Math.max(-300,Math.min(300,P.z));
}
function where(){const r=rooms.find(r=>r.f===P.f&&P.x>r.x0&&P.x<r.x1&&P.z>r.z0&&P.z<r.z1);if(r)return r.name;
  if(CORR.some(r=>P.x>r.x0&&P.x<r.x1&&P.z>r.z0&&P.z<r.z1))return 'Corridor, floor '+(P.f+1);return 'Outside'}
let t0=0,hudT='';
function loop(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  if(mode==='walk'){walk(dt);cam.position.set(P.x,P.f*FH+1.65,P.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ');
    const h='<b>'+where()+'</b> &nbsp; WASD move · Shift run · mouse look · '+(bl.nF>1?'1/2 floor · ':'')+'Esc frees the mouse';if(h!==hudT){$('hud').innerHTML=hudT=h}}
  else{const c0=bl.ctr;cam.position.set(c0[0]+R*Math.sin(ph)*Math.sin(th),R*Math.cos(ph)+2,c0[1]+R*Math.sin(ph)*Math.cos(th));cam.lookAt(c0[0],1,c0[1]);
    const h='Drag to rotate · scroll to zoom · <b>C</b> toggles cutaway'+(bl.nF>1?' · pick a floor':'');if(h!==hudT){$('hud').innerHTML=hudT=h}}
  ren.render(scene,cam);requestAnimationFrame(loop)}
ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
load(0);requestAnimationFrame(loop);
</script>
