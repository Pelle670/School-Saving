  const el=$('rooms');el.innerHTML='<h3>Go to a room</h3>';
  const e0=document.createElement('button');e0.textContent='Front entrance';e0.onclick=()=>{setMode('walk');spawn();if(ren.domElement.requestPointerLock)ren.domElement.requestPointerLock()};el.appendChild(e0);
  rooms.forEach(r=>{const b=document.createElement('button');b.textContent=(bl.nF>1?'F'+(r.f+1)+' · ':'')+r.name;b.onclick=()=>goRoom(r);el.appendChild(b)});
  apply();
}
SCH.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.onclick=()=>load(i);$('tabs').appendChild(b)});
$('vo').onclick=()=>setMode('orbit');$('vw').onclick=()=>{setMode('walk');if(ren.domElement.requestPointerLock)ren.domElement.requestPointerLock()};
$('bc').onclick=()=>{state.cut=!state.cut;apply()};

const cv=ren.domElement;let drag=0,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=1;lx=e.clientX;ly=e.clientY;if(mode==='walk'&&!document.pointerLockElement&&cv.requestPointerLock)cv.requestPointerLock()});
addEventListener('pointerup',()=>drag=0);
addEventListener('pointermove',e=>{
  if(mode==='orbit'){if(!drag)return;th-=(e.clientX-lx)*.006;ph=Math.min(1.45,Math.max(.12,ph-(e.clientY-ly)*.006))}
  else if(document.pointerLockElement||drag){const dx=document.pointerLockElement?e.movementX:e.clientX-lx,dy=document.pointerLockElement?e.movementY:e.clientY-ly;P.yaw-=dx*.003;P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch-dy*.003))}
  lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{R=Math.min(170,Math.max(15,R*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{k[e.code]=1;if(mode==='walk'){if(e.code==='Digit1')go(0);if(e.code==='Digit2'&&bl.nF>1)go(1)}if(e.code==='KeyC'&&mode==='orbit'){state.cut=!state.cut;apply()}});
addEventListener('keyup',e=>k[e.code]=0);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const hit=(x,z)=>cols.some(c=>c.f===P.f&&x>c.x0-.3&&x<c.x1+.3&&z>c.z0-.3&&z<c.z1+.3);
function walk(dt){
  const fw=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0),st=(k.KeyD?1:0)-(k.KeyA?1:0);
  P.yaw+=((k.ArrowLeft?1:0)-(k.ArrowRight?1:0))*dt*1.8;
  const v=(k.ShiftLeft||k.ShiftRight?6:3)*dt,dx=(-Math.sin(P.yaw)*fw+Math.cos(P.yaw)*st)*v,dz=(-Math.cos(P.yaw)*fw-Math.sin(P.yaw)*st)*v;
  if(!hit(P.x+dx,P.z))P.x+=dx;if(!hit(P.x,P.z+dz))P.z+=dz;P.x=Math.max(-170,Math.min(170,P.x));P.z=Math.max(-170,Math.min(170,P.z));
}
function where(){const r=rooms.find(r=>r.f===P.f&&P.x>r.x0&&P.x<r.x1&&P.z>r.z0&&P.z<r.z1);if(r)return r.name;
  if(P.x>OX&&P.x<OX+bl.L&&Math.abs(P.z)<CW/2)return 'Corridor, floor '+(P.f+1);return 'Outside'}
let t0=0,hudT='';
function loop(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  if(mode==='walk'){walk(dt);cam.position.set(P.x,P.f*FH+1.65,P.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ');
    const h='<b>'+where()+'</b> &nbsp; WASD move · Shift run · mouse look · '+(bl.nF>1?'1/2 floor · ':'')+'Esc frees the mouse';if(h!==hudT){$('hud').innerHTML=hudT=h}}
  else{cam.position.set(R*Math.sin(ph)*Math.sin(th),R*Math.cos(ph)+2,R*Math.sin(ph)*Math.cos(th));cam.lookAt(0,1,0);
    const h='Drag to rotate · scroll to zoom · <b>C</b> toggles cutaway'+(bl.nF>1?' · pick a floor':'');if(h!==hudT){$('hud').innerHTML=hudT=h}}
  ren.render(scene,cam);requestAnimationFrame(loop)}
ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
load(0);requestAnimationFrame(loop);
</script>
</body>
